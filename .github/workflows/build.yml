name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nötig für GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build.js hat keine npm-Abhängigkeiten — direkt ausführen
      - name: Build extension
        run: node build.js

      # Nur die Dateien die Chrome braucht, kein src/, docs/, build.js, etc.
      - name: Package installable ZIP
        run: |
          mkdir -p _release
          cp manifest.json _release/
          cp background.js  _release/
          cp -r popup        _release/popup
          cp -r icons        _release/icons
          cp -r dist         _release/dist
          cd _release
          zip -r ../mydealz-manager-ext.zip .
          cd ..
          echo "ZIP contents:"
          unzip -l mydealz-manager-ext.zip

      # Bei jedem Push auf main: Artefakt hochladen (30 Tage verfügbar)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydealz-manager-ext
          path: mydealz-manager-ext.zip
          retention-days: 30

      # Nur bei Tag-Push (z.B. v2.1.0): echtes GitHub Release erstellen
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mydealz-manager-ext.zip
          generate_release_notes: true
          body: |
            ## Installation

            1. **ZIP herunterladen** → `mydealz-manager-ext.zip` unten unter Assets
            2. **Entpacken** (normales ZIP-Entpacken reicht)
            3. Chrome öffnen → `chrome://extensions`
            4. **Entwicklermodus** aktivieren (Toggle oben rechts)
            5. **"Entpackte Erweiterung laden"** → den entpackten Ordner auswählen
            6. Auf [mydealz.de](https://www.mydealz.de) gehen — fertig ✓
