<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mydealz Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
    <path d="M2 17l10 5 10-5"/>
    <path d="M2 12l10 5 10-5"/>
  </svg>
  <h1>mydealz Manager</h1>
  <span class="version">v2.0</span>
</header>

<!-- Stats -->
<div class="section">
  <div class="stat-row">
    <div class="stat">
      <span class="num" id="stat-hidden">–</span>
      <span class="lbl">Versteckt</span>
    </div>
    <div class="stat">
      <span class="num" id="stat-merchants">–</span>
      <span class="lbl">Händler blockiert</span>
    </div>
    <div class="stat">
      <span class="num" id="stat-words">–</span>
      <span class="lbl">Ausblend-Wörter</span>
    </div>
  </div>
</div>

<!-- Filterlisten -->
<div class="section">
  <label for="exclude-words">Wörter ausblenden</label>
  <input type="text" id="exclude-words" placeholder="gaming, apple, crypto, ...">
</div>

<div class="section">
  <label for="whitelist-words">Whitelist (nie verstecken)</label>
  <input type="text" id="whitelist-words" placeholder="lego, kindle, ...">
</div>

<div class="section">
  <label for="blocked-users">User blocken</label>
  <input type="text" id="blocked-users" placeholder="username1, username2, ...">
</div>

<!-- Blocked merchants -->
<div class="section">
  <label>Händler blockiert</label>
  <div class="tag-list" id="merchant-tags"></div>
  <p class="no-merchants" id="no-merchants">
    Keine – Händler direkt auf mydealz.de über ⚙ blockieren
  </p>
</div>

<!-- Preis + Rabatt -->
<div class="section">
  <div style="display: flex; gap: 8px;">
    <div style="flex: 1;">
      <label for="max-price">Max. Preis (€)</label>
      <input type="number" id="max-price" min="0" step="0.01" placeholder="kein Limit">
    </div>
    <div style="flex: 1;">
      <label for="min-discount">Mind. Rabatt (%)</label>
      <input type="number" id="min-discount" min="0" max="100" step="1" placeholder="kein Limit">
    </div>
  </div>
</div>

<!-- Semantische Schalter (W3C switch, kein onclick-JS) -->
<div class="section">
  <div class="switch-row">
    <input type="checkbox" switch id="hide-cold">
    <span><label for="hide-cold">Kalte Deals (&lt;0°) ausblenden</label></span>
  </div>
  <div class="switch-row">
    <input type="checkbox" switch id="hide-own-cold">
    <span><label for="hide-own-cold">Eigene Cold-Votes ausblenden</label></span>
  </div>
  <div class="switch-row">
    <input type="checkbox" switch id="hide-merchant-names">
    <span><label for="hide-merchant-names">Händlernamen auch im Titel prüfen</label></span>
  </div>
  <div class="switch-row">
    <input type="checkbox" switch id="hide-nsfw">
    <span><label for="hide-nsfw">NSFW-gegraute Deals ausblenden</label></span>
  </div>
  <div class="switch-row">
    <input type="checkbox" switch id="strip-merchant-title">
    <span><label for="strip-merchant-title">Händlernamen aus Titeln entfernen</label></span>
  </div>
  <div class="switch-row">
    <input type="checkbox" switch id="remember-sort">
    <span><label for="remember-sort">Sortierpräferenz merken</label></span>
  </div>
  <div class="switch-row">
    <input type="checkbox" switch id="debug-mode">
    <span><label for="debug-mode">Debug-Modus</label></span>
  </div>
</div>

<!-- Permalink-Übersetzer (Quelle: mydealz-Diskussion 2462696) -->
<div class="section">
  <label for="pl-input">Permalink-Übersetzer</label>
  <textarea id="pl-input" rows="3" placeholder="Alte Links einfügen (…/comments/permalink/12345)"></textarea>
  <div style="display:flex; gap:8px; margin-top:6px;">
    <button class="btn-small" id="btn-permalinks" title="Kommentar-IDs auflösen (mydealz-Tab muss offen sein)">↻ Auflösen</button>
    <button class="btn-small" id="btn-pl-copy" hidden>⧉ Kopieren</button>
  </div>
  <textarea id="pl-output" rows="3" hidden readonly placeholder="Ergebnis"></textarea>
  <p class="no-merchants" id="pl-note" hidden></p>
</div>

<div popover id="saved-msg">✓ Gespeichert!</div>

<footer>
  <button id="btn-reset" title="Alle Einstellungen zurücksetzen (verdeckte Deals bleiben)">↺</button>
  <button class="btn-small" id="btn-import" title="Einstellungen aus JSON importieren">⬆ Import</button>
  <button class="btn-small" id="btn-export" title="Einstellungen als JSON exportieren">⬇ Export</button>
  <button class="btn-primary" id="btn-save">Speichern</button>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</footer>

<script src="../dist/settings-schema.js"></script>
<script src="popup.js"></script>
</body>
</html>
